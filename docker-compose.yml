# Production-safe Redis defaults:
# - Redis is only reachable on the private Compose network (no host port publish).
# - REDIS_PASSWORD is required; api/worker connect with redis://:<password>@redis:6379.
# - CONFIG, REPLICAOF, and SLAVEOF are disabled because this app uses Redis only as a Bull queue.
services:
  redis:
    image: redis:7-alpine
    container_name: videotools-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # Less aggressive persistence to reduce fork() and blocking; AOF only keeps durability with fewer spikes.
    # Disable CONFIG/REPLICAOF/SLAVEOF so neither an exposed socket nor an app bug can persistently
    # reconfigure this standalone queue Redis into a read-only replica.
    command: >
      sh -c 'exec redis-server
      --bind 0.0.0.0
      --protected-mode yes
      --dir /data
      --save ""
      --appendonly yes
      --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --rename-command CONFIG ""
      --rename-command REPLICAOF ""
      --rename-command SLAVEOF ""'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: videotools-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"   # Host 5433 to avoid conflict with local Postgres on 5432
    environment:
      POSTGRES_USER: videotools
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: videotext
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videotools -d videotext"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build: .
    image: videotools-api
    container_name: videotools-api
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      DATABASE_URL: postgresql://videotools:${POSTGRES_PASSWORD}@postgres:5432/videotext
      TEMP_FILE_PATH: /tmp
      STREAM_UPLOAD_ASSEMBLY: "true"
      DISABLE_WORKER: "true"
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      # Must match worker — API routes YouTube jobs to captionQueue when true
      YOUTUBE_QUEUE_SEPARATION: "true"
      # Residential proxy for yt-dlp metadata fallback (when YOUTUBE_API_KEY is unset).
      # Set in .env: YOUTUBE_PROXY=http://user:pass@gw.dataimpulse.com:823
      YOUTUBE_PROXY: ${YOUTUBE_PROXY:-}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    volumes:
      - tmp-files:/tmp
    ports:
      - "3001:3001"
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: videotools-api
    container_name: videotools-worker
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      DATABASE_URL: postgresql://videotools:${POSTGRES_PASSWORD}@postgres:5432/videotext
      TEMP_FILE_PATH: /tmp
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      # TTFW: extract first 20s chunk early instead of full-file extract then split
      PROCESSING_V2: "true"
      # Separate YouTube caption/audio/transcription queues so caption fetches (seconds)
      # are never blocked by Whisper transcription jobs (minutes). Both API and worker
      # must share this flag so jobs route to the same queue.
      YOUTUBE_QUEUE_SEPARATION: "true"
      # Cookies are optional but volume-backed so ops can drop/update youtube.txt manually.
      YOUTUBE_SKIP_COOKIES: "false"
      YOUTUBE_COOKIES_FILE: /cookies/youtube.txt
      # Optional cookie pool for resilient rotation/cooldown. Override in .env:
      # YOUTUBE_COOKIE_FILES=/cookies/youtube_1.txt,/cookies/youtube_2.txt,/cookies/youtube_3.txt
      YOUTUBE_COOKIE_FILES: ${YOUTUBE_COOKIE_FILES:-}
      # Residential proxy for yt-dlp caption/audio fallback (and metadata if no API key).
      # Set in .env: YOUTUBE_PROXY=http://user:pass@gw.dataimpulse.com:823
      YOUTUBE_PROXY: ${YOUTUBE_PROXY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - tmp-files:/tmp
      - yt-cookies:/cookies
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    command: node dist/workers/videoProcessor.js

  # ── Docker build-cache cleanup ────────────────────────────────────────────
  # Prunes images and build cache older than 7 days every Sunday at 03:00 UTC.
  # Prevents Docker's build cache from silently accumulating GBs over time.
  # Logs: docker compose logs docker-cleanup
  docker-cleanup:
    image: docker:cli
    container_name: videotools-docker-cleanup
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/docker-cleanup.sh:/scripts/docker-cleanup.sh:ro
    command: >
      sh -c "
        chmod +x /scripts/docker-cleanup.sh &&
        echo '0 3 * * 0 /scripts/docker-cleanup.sh >> /proc/1/fd/1 2>&1' | crontab - &&
        crond -f -l 2
      "
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.1"

volumes:
  redis-data:
  postgres-data:
  tmp-files:
  yt-cookies:
